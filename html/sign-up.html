<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Bloom account to start ordering fresh flowers and gifts.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Create Account — Bloom</title>
    <link rel="stylesheet" href="/css/sign-up.css">
</head>

<body>
    <section>
        <div class="signin-container">
            <!-- Illustration / Brand Side -->
            <div class="illustration-side">
                <img src="/image/contact/contact.png" alt="Bloom flowers illustration">
            </div>

            <!-- Form Side -->
            <div class="form-side">
                <h2>Join Bloom 🌸</h2>
                <p class="subtitle">Create your account to get started.</p>

                <form id="signup-form">
                    <div class="input-group">
                        <label for="signup-name"><span class="required">*</span> Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    </div>

                    <div class="input-group">
                        <label for="signup-email"><span class="required">*</span> Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="signup-password"><span class="required">*</span> Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-password" placeholder="Create a password" required>
                            <span class="toggle-password" id="toggle-pw-1">👁️</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="signup-confirm"><span class="required">*</span> Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                            <span class="toggle-password" id="toggle-pw-2">👁️</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-signin" id="btn-signup">
                        <a href="index.html"><i class="fa-solid fa-user-plus"></i> &nbsp;Create Account</a>
                    </button>
                    <button type="button" class="btn-create" id="btn-signin-link">
                        <a href="sign-in.html"><i class="fa-solid fa-arrow-right-to-bracket"></i> &nbsp;Already have an account? Sign In</a>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('toggle-pw-1').addEventListener('click', function () {
            const pw = document.getElementById('signup-password');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });
        document.getElementById('toggle-pw-2').addEventListener('click', function () {
            const pw = document.getElementById('signup-confirm');
            pw.type = pw.type === 'password' ? 'text' : 'password';
        });
    </script>
</body>

</html>
