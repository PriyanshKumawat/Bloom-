<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Bloom account password.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Reset Password — Bloom</title>
    <link rel="stylesheet" href="/css/reset.css">
</head>

<body>
    <section>
        <div class="signin-container">
            <!-- Illustration Side -->
            <div class="illustration-side">
                <img src="/image/contact/contact.png" alt="Bloom flowers illustration">
            </div>

            <!-- Form Side -->
            <div class="form-side">
                <h2>Reset Password 🔐</h2>
                <p class="subtitle">Enter your email and we'll send you a reset link.</p>

                <form id="reset-form">
                    <div class="input-group">
                        <label for="reset-email"><span class="required">*</span> Email</label>
                        <input type="email" id="reset-email" placeholder="Enter your email" required autocomplete="email">
                    </div>

                    <button type="button" class="btn-signin" id="btn-reset" onclick="sendReset()">
                        <i class="fa-solid fa-envelope"></i> &nbsp;Send Reset Link
                    </button>
                    <button type="button" class="btn-create">
                        <a href="sign-in.html">
                            <i class="fa-solid fa-arrow-left"></i> &nbsp;Back to Sign In
                        </a>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function sendReset() {
            const email = document.getElementById('reset-email').value.trim();
            if (!email) { alert('Please enter your email address.'); return; }
            const btn = document.getElementById('btn-reset');
            btn.innerHTML = '<i class="fa-solid fa-check"></i> &nbsp;Link Sent!';
            btn.style.background = 'linear-gradient(135deg,#10b981,#059669)';
            btn.disabled = true;
        }
    </script>
</body>

</html>
