<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/sign-in.css">
</head>

<body>
    <!-- -------------------section-content-------------- -->
    <section>

        <div class="signin-container">
            <div class="illustration-side">
                <img src="/image/contact/contact.png" alt="">
            </div>

            <div class="form-side">
                <h2>Sign In</h2>
                <p class="subtitle">Unlock you world.</p>

                <form>
                    <div class="input-group">
                        <label><span class="required">*</span> Email</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-group">
                        <label><span class="required">*</span> Password</label>
                        <div class="password-wrapper">
                            <input type="password" placeholder="Enter your password">
                            <span class="toggle-password">👁️</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-signin"><a href="index.html">Sign In</a></button>
                    <button type="button" class="btn-create"><a href="create-an-account.html">Create an
                            account</a></button>
                </form>
            </div>
        </div>
    </section>
</body>

</html>
